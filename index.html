<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>都道府県シルエットクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#28324a;
  --ink-soft:#4a5675;
  --paper:#eee7d6;
  --paper-deep:#e2d8bf;
  --paper-card:#f6f1e4;
  --stamp:#bd2a2e;
  --stamp-deep:#8f1f22;
  --gold:#a9822f;
  --line:#b9ad8c;
  --miss:#8b8272;
  --correct:#3d6b4f;
  font-size: 16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 700px at 15% -10%, #f5efdf 0%, transparent 60%),
    radial-gradient(1000px 800px at 110% 10%, #e6dcc2 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  font-family:'Zen Maru Gothic', sans-serif;
  min-height:100vh;
  padding: 28px 16px 48px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;}

/* ---------- header ---------- */
header.app-head{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:22px;
}
.seal-mark{
  flex:0 0 auto;
  width:44px;height:44px;
  border:2.5px solid var(--stamp);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--stamp);
  font-family:'Shippori Mincho', serif;
  font-weight:800;
  font-size:22px;
  transform:rotate(-4deg);
  background:var(--paper-card);
}
h1{
  font-family:'Shippori Mincho', serif;
  font-weight:800;
  font-size:clamp(22px, 5vw, 30px);
  margin:0;
  letter-spacing:.02em;
  line-height:1.25;
}
h1 small{
  display:block;
  font-family:'Zen Maru Gothic',sans-serif;
  font-weight:500;
  font-size:13px;
  color:var(--ink-soft);
  letter-spacing:.03em;
  margin-top:2px;
}

/* ---------- shared card ---------- */
.card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 10px 24px -18px rgba(40,50,74,.5);
  padding:22px;
}
.screen{display:none;}
.screen.active{display:block;}

/* ---------- start screen ---------- */
.lead{
  font-size:15px;
  line-height:1.9;
  color:var(--ink-soft);
  margin:0 0 22px;
}
.field-label{
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:14px;
  color:var(--ink);
  margin:0 0 10px;
  display:flex;
  align-items:center;
  gap:8px;
}
.field-label::before{
  content:"";
  width:14px;height:2px;background:var(--stamp);display:inline-block;
}
.chip-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:24px;
}
.chip{
  border:1.5px solid var(--line);
  background:var(--paper);
  color:var(--ink-soft);
  font-family:'Zen Maru Gothic',sans-serif;
  font-weight:700;
  font-size:14px;
  padding:9px 16px;
  border-radius:999px;
  cursor:pointer;
  transition:all .15s ease;
}
.chip:hover{border-color:var(--gold);}
.chip:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
.chip.selected{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--paper-card);
}
.start-btn{
  width:100%;
  margin-top:6px;
  border:none;
  background:var(--stamp);
  color:#fff;
  font-family:'Shippori Mincho', serif;
  font-weight:800;
  font-size:18px;
  letter-spacing:.06em;
  padding:16px;
  border-radius:14px;
  cursor:pointer;
  box-shadow:0 8px 18px -8px rgba(189,42,46,.6);
  transition:transform .12s ease, box-shadow .12s ease;
}
.start-btn:hover{transform:translateY(-1px); box-shadow:0 10px 20px -8px rgba(189,42,46,.7);}
.start-btn:active{transform:translateY(1px);}
.start-btn:focus-visible{outline:3px solid var(--gold); outline-offset:3px;}

/* ---------- quiz top bar ---------- */
.quiz-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  font-size:13px;
  color:var(--ink-soft);
  font-weight:700;
}
.quiz-top .region-tag{
  background:var(--paper-deep);
  padding:5px 12px;
  border-radius:999px;
  font-size:12px;
}
.progress-track{
  height:6px;
  background:var(--paper-deep);
  border-radius:99px;
  overflow:hidden;
  margin-bottom:20px;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg, var(--gold), var(--stamp));
  width:0%;
  transition:width .35s ease;
}

/* ---------- silhouette stage ---------- */
.stage{
  position:relative;
  margin:4px auto 22px;
  width:min(260px, 62vw);
  height:min(260px, 62vw);
  border-radius:50%;
  background:
    repeating-conic-gradient(var(--paper-card) 0deg, var(--paper-card) 4deg, var(--paper) 4deg, var(--paper) 6deg);
  display:flex;
  align-items:center;
  justify-content:center;
}
.stage::before{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:50%;
  border:2px dashed var(--gold);
  opacity:.55;
}
#silhouette-holder{
  width:68%;
  height:68%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.silhouette-svg{
  width:100%;
  height:100%;
  overflow:visible;
  filter:drop-shadow(0 6px 10px rgba(40,50,74,.25));
  animation:pop-in .35s ease;
}
.silhouette-svg path,
.silhouette-svg polygon{
  fill:var(--ink);
}
@keyframes pop-in{
  from{opacity:0; transform:scale(.85);}
  to{opacity:1; transform:scale(1);}
}

/* stamp burst on correct */
.stamp-burst{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:0;
}
.stamp-burst.show{
  animation:stamp-down .55s cubic-bezier(.2,1.6,.4,1) forwards;
}
.stamp-burst svg{width:78%;height:78%;}
@keyframes stamp-down{
  0%{opacity:0; transform:scale(2.4) rotate(-18deg);}
  55%{opacity:.95; transform:scale(.92) rotate(-8deg);}
  75%{opacity:.95; transform:scale(1.05) rotate(-8deg);}
  100%{opacity:.92; transform:scale(1) rotate(-8deg);}
}

/* ---------- choices ---------- */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}
@media (max-width:420px){
  .choices{grid-template-columns:1fr;}
}
.choice-btn{
  font-family:'Zen Maru Gothic', sans-serif;
  font-weight:700;
  font-size:16px;
  padding:14px 12px;
  border-radius:12px;
  border:2px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  cursor:pointer;
  transition:all .12s ease;
  text-align:center;
}
.choice-btn:hover:not(:disabled){border-color:var(--gold); background:var(--paper-card);}
.choice-btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
.choice-btn:disabled{cursor:default;}
.choice-btn.correct{
  background:var(--correct);
  border-color:var(--correct);
  color:#fff;
}
.choice-btn.wrong{
  background:#e9dfd0;
  border-color:var(--miss);
  color:var(--miss);
  text-decoration:line-through;
}
.choice-btn.reveal{
  background:var(--correct);
  border-color:var(--correct);
  color:#fff;
}
.choice-btn.picked{
  border-color:var(--ink);
  background:var(--paper-deep);
  box-shadow:0 0 0 2px var(--ink) inset;
}
.pick-hint{
  font-size:12px;
  color:var(--ink-soft);
  margin:-6px 0 12px;
}
.pick-hint strong{color:var(--stamp);}

/* ---------- hint + feedback ---------- */
.util-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:6px;
}
.hint-btn{
  border:1.5px dashed var(--gold);
  background:transparent;
  color:var(--gold);
  font-weight:700;
  font-size:13px;
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
}
.hint-btn:hover{background:rgba(169,130,47,.08);}
.hint-btn:disabled{opacity:.35; cursor:default;}
.score-tag{font-size:13px; font-weight:700; color:var(--ink-soft);}

.hint-panel{
  display:none;
  margin:10px 0 4px;
  padding:14px;
  background:var(--paper);
  border-radius:12px;
  border:1px solid var(--line);
  align-items:center;
  gap:14px;
}
.hint-panel.show{display:flex;}
.hint-panel svg{width:86px;height:86px;flex:0 0 auto;}
.hint-panel p{margin:0; font-size:13px; line-height:1.7; color:var(--ink-soft);}
.hint-panel strong{color:var(--ink);}

.feedback{
  display:none;
  margin-top:6px;
  padding:16px;
  border-radius:14px;
  background:var(--paper);
  border:1px solid var(--line);
}
.feedback.show{display:block; animation:pop-in .25s ease;}
.feedback .fb-name{
  font-family:'Shippori Mincho', serif;
  font-weight:800;
  font-size:20px;
  display:flex;
  align-items:baseline;
  gap:8px;
  margin-bottom:4px;
}
.feedback .fb-kana{font-size:13px; font-weight:500; color:var(--ink-soft);}
.feedback .fb-sub{font-size:13px; color:var(--ink-soft); margin:0;}
.feedback .fb-result{
  display:inline-block;
  font-size:12px;
  font-weight:700;
  padding:3px 10px;
  border-radius:999px;
  margin-bottom:10px;
}
.feedback.is-correct .fb-result{background:var(--correct); color:#fff;}
.feedback.is-wrong .fb-result{background:var(--miss); color:#fff;}
.next-btn{
  margin-top:12px;
  width:100%;
  border:none;
  background:var(--ink);
  color:var(--paper-card);
  font-family:'Shippori Mincho', serif;
  font-weight:800;
  font-size:16px;
  padding:13px;
  border-radius:12px;
  cursor:pointer;
}
.next-btn:hover{background:var(--ink-soft);}
.next-btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

/* ---------- passport strip ---------- */
.passport{
  margin-top:26px;
}
.passport-title{
  font-size:12px;
  font-weight:700;
  color:var(--ink-soft);
  margin:0 0 10px;
  letter-spacing:.04em;
}
.region-group{margin-bottom:10px;}
.region-group-label{
  font-size:11px;
  color:var(--gold);
  font-weight:700;
  margin-bottom:5px;
}
.stamp-grid{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.stamp-cell{
  position:relative;
  width:30px;height:30px;
  border-radius:7px;
  border:1.5px solid var(--line);
  background:var(--paper);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  color:var(--miss);
  overflow:hidden;
}
.stamp-cell.current{border-color:var(--gold); box-shadow:0 0 0 3px rgba(169,130,47,.18);}
.stamp-cell.done-correct{
  color:transparent;
  border-color:var(--stamp);
}
.stamp-cell.done-correct::after{
  content:"合";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--stamp);
  font-family:'Shippori Mincho', serif;
  font-size:14px;
  border:2px solid var(--stamp);
  border-radius:5px;
  margin:1px;
  transform:rotate(-6deg);
}
.stamp-cell.done-wrong{color:var(--miss); background:#e9e2d0;}

/* ---------- result screen ---------- */
.result-hero{
  text-align:center;
  padding:6px 0 18px;
}
.result-hero .big-score{
  font-family:'Shippori Mincho', serif;
  font-weight:800;
  font-size:56px;
  color:var(--stamp);
  line-height:1;
}
.result-hero .big-score span{font-size:22px; color:var(--ink-soft); font-weight:700;}
.result-hero p{color:var(--ink-soft); font-size:14px; margin-top:8px;}
.review-list{
  list-style:none;
  margin:18px 0;
  padding:0;
  display:grid;
  gap:8px;
}
.review-list li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px;
  font-size:14px;
}
.review-list li .rl-name{font-weight:700;}
.review-list li .rl-kana{font-size:12px; color:var(--ink-soft); margin-left:6px;}
.review-empty{
  text-align:center;
  color:var(--ink-soft);
  font-size:14px;
  padding:18px 0;
}
.result-btns{display:flex; gap:10px; margin-top:8px;}
.result-btns button{flex:1;}
.ghost-btn{
  border:1.5px solid var(--ink);
  background:transparent;
  color:var(--ink);
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:15px;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
}
.ghost-btn:hover{background:var(--paper);}

/* hint mini map */
#hint-map-source{display:none;}

@media (prefers-reduced-motion: reduce){
  .silhouette-svg, .feedback.show, .stamp-burst.show{animation:none !important;}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <div class="seal-mark">図</div>
    <h1>都道府県シルエットクイズ
      <small>かたちを見て、都道府県を当てよう</small>
    </h1>
  </header>

  <!-- ===================== START SCREEN ===================== -->
  <section id="screen-start" class="screen active card">
    <p class="lead" id="lead-text">黒いシルエットがどこの都道府県か、4つの中から選んでね。正解すると、下のパスポートにスタンプが増えていくよ。</p>

    <p class="field-label">しゅるい</p>
    <div class="chip-row" id="mode-chips"></div>

    <p class="field-label" id="region-label">はんい</p>
    <div class="chip-row" id="region-chips"></div>

    <p class="field-label">もんだいすう</p>
    <div class="chip-row" id="count-chips"></div>

    <button class="start-btn" id="start-btn">はじめる</button>
  </section>

  <!-- ===================== QUIZ SCREEN ===================== -->
  <section id="screen-quiz" class="screen card">
    <div class="quiz-top">
      <span id="progress-label">1 / 10</span>
      <span class="region-tag" id="region-tag-quiz">全国</span>
      <span class="score-tag" id="score-label">せいかい 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="stage">
      <div id="silhouette-holder"></div>
      <div class="stamp-burst" id="stamp-burst">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#bd2a2e" stroke-width="6"/>
          <circle cx="60" cy="60" r="40" fill="none" stroke="#bd2a2e" stroke-width="2"/>
          <text x="60" y="70" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="34" font-weight="800" fill="#bd2a2e">合</text>
        </svg>
      </div>
    </div>

    <div class="choices" id="choices"></div>
    <p class="pick-hint" id="pick-hint" style="display:none;"></p>

    <div class="util-row">
      <button class="hint-btn" id="hint-btn">ヒント：地図で見る</button>
    </div>
    <div class="hint-panel" id="hint-panel"></div>

    <div class="feedback" id="feedback">
      <span class="fb-result" id="fb-result"></span>
      <div class="fb-name" id="fb-name"></div>
      <p class="fb-sub" id="fb-sub"></p>
      <button class="next-btn" id="next-btn">つぎへ →</button>
    </div>

    <div class="passport">
      <p class="passport-title">スタンプパスポート</p>
      <div id="passport-body"></div>
    </div>
  </section>

  <!-- ===================== RESULT SCREEN ===================== -->
  <section id="screen-result" class="screen card">
    <div class="result-hero">
      <div class="big-score"><span id="result-score">0</span><span> / <span id="result-total">10</span></span></div>
      <p id="result-msg"></p>
    </div>
    <div id="review-wrap"></div>
    <div class="result-btns">
      <button class="ghost-btn" id="retry-btn">もう一度おなじ設定で</button>
      <button class="start-btn" id="restart-btn" style="margin-top:0;">はんいを選びなおす</button>
    </div>
  </section>

</div>

  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function sample(arr, n){ return shuffle(arr).slice(0,n); }

// ---------- start screen ----------
const leadText = document.getElementById('lead-text');
const modeChipsEl = document.getElementById('mode-chips');
const regionLabelEl = document.getElementById('region-label');
const regionChipsEl = document.getElementById('region-chips');
const countChipsEl = document.getElementById('count-chips');

const LEAD = {
  single: "黒いシルエットがどこの都道府県か、4つの中から選んでね。正解すると、下のパスポートにスタンプが増えていくよ。",
  pair: "となり合う2つの都道府県が、1つの黒いシルエットになっているよ。カードを2枚タップして、都道府県を2つとも当ててね。"
};

[["single","1つの都道府県"], ["pair","隣り合う2県（上級）"]].forEach(([val,label])=>{
  const btn = document.createElement('button');
  btn.className = 'chip' + (val===settings.mode ? ' selected':'');
  btn.textContent = label;
  btn.addEventListener('click', ()=>{
    settings.mode = val;
    [...modeChipsEl.children].forEach(c=>c.classList.toggle('selected', c===btn));
    leadText.textContent = LEAD[val];
    regionLabelEl.style.display = (val==='pair') ? 'none' : '';
    regionChipsEl.style.display = (val==='pair') ? 'none' : '';
    syncCountChips();
  });
  modeChipsEl.appendChild(btn);
});

["全国", ...REGION_ORDER].forEach(r=>{
  const btn = document.createElement('button');
  btn.className = 'chip' + (r===settings.region ? ' selected':'');
  btn.textContent = r;
  btn.dataset.region = r;
  btn.addEventListener('click', ()=>{
    settings.region = r;
    [...regionChipsEl.children].forEach(c=>c.classList.toggle('selected', c===btn));
    syncCountChips();
  });
  regionChipsEl.appendChild(btn);
});

function syncCountChips(){
  const max = settings.mode === 'pair' ? PAIR_KEYS.length : codesForRegion(settings.region).length;
  const base = settings.mode === 'pair' ? [10,20,40] : [10,20,47];
  const options = base.filter(n=>n<=max);
  if(!options.includes(max)) options.push(max);
  countChipsEl.innerHTML = '';
  const uniqueSorted = [...new Set(options)].sort((a,b)=>a-b);
  uniqueSorted.forEach((n,i)=>{
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = (n===max) ? `${n}問（全部）` : `${n}問`;
    btn.dataset.count = n;
    if(i===0){ btn.classList.add('selected'); settings.count = n; }
    btn.addEventListener('click', ()=>{
      settings.count = n;
      [...countChipsEl.children].forEach(c=>c.classList.toggle('selected', c===btn));
    });
    countChipsEl.appendChild(btn);
  });
}
syncCountChips();

document.getElementById('start-btn').addEventListener('click', ()=>{
  beginQuiz();
});

// ---------- screen switching ----------
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

// ---------- quiz flow ----------
function beginQuiz(){
  idx = 0; score = 0; results = []; pickedCodes = [];
  if(settings.mode === 'pair'){
    queue = sample(PAIR_KEYS, Math.min(settings.count, PAIR_KEYS.length));
    document.getElementById('region-tag-quiz').textContent = '隣り合う2県';
    document.getElementById('passport-body').parentElement.style.display = 'none';
  } else {
    const pool = codesForRegion(settings.region);
    queue = sample(pool, Math.min(settings.count, pool.length));
    document.getElementById('region-tag-quiz').textContent = settings.region;
    document.getElementById('passport-body').parentElement.style.display = '';
    buildPassport();
  }
  showScreen('screen-quiz');
  renderQuestion();
}

function currentPool(){
  return codesForRegion(settings.region);
}

function renderQuestion(){
  answeredThisQ = false;
  pickedCodes = [];

  document.getElementById('progress-label').textContent = `${idx+1} / ${queue.length}`;
  document.getElementById('score-label').textContent = `せいかい ${score}`;
  document.getElementById('progress-fill').style.width = `${(idx/queue.length)*100}%`;

  document.getElementById('feedback').classList.remove('show','is-correct','is-wrong');
  document.getElementById('hint-panel').classList.remove('show');
  document.getElementById('hint-btn').disabled = false;
  document.getElementById('stamp-burst').classList.remove('show');

  if(settings.mode === 'pair'){
    renderPairQuestion();
  } else {
    renderSingleQuestion();
  }
}

function renderSingleQuestion(){
  const code = queue[idx];
  const data = PREF_DATA[code];
  const holder = document.getElementById('silhouette-holder');
  holder.innerHTML = `<svg class="silhouette-svg" viewBox="${data.viewBox}" xmlns="http://www.w3.org/2000/svg"><g fill-rule="evenodd">${data.markup}</g></svg>`;

  const pool = currentPool().filter(c=>c!==code);
  const distractors = sample(pool, Math.min(3, pool.length));
  const options = shuffle([code, ...distractors]);

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  document.getElementById('pick-hint').style.display = 'none';
  options.forEach(optCode=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = PREF_DATA[optCode].name;
    btn.dataset.code = optCode;
    btn.addEventListener('click', ()=>selectSingleAnswer(optCode, code, btn));
    choicesEl.appendChild(btn);
  });

  highlightPassportCurrent(code);
}

function selectSingleAnswer(chosenCode, correctCode, btnEl){
  if(answeredThisQ) return;
  answeredThisQ = true;

  const isCorrect = chosenCode === correctCode;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = true;
    if(b.dataset.code === correctCode) b.classList.add(isCorrect ? 'correct' : 'reveal');
    else if(b === btnEl) b.classList.add('wrong');
  });

  if(isCorrect){
    score++;
    document.getElementById('stamp-burst').classList.add('show');
  }
  results.push({type:'single', code: correctCode, correct: isCorrect});
  markPassport(correctCode, isCorrect);
  document.getElementById('score-label').textContent = `せいかい ${score}`;

  const data = PREF_DATA[correctCode];
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'is-correct' : 'is-wrong');
  document.getElementById('fb-result').textContent = isCorrect ? 'せいかい！' : 'ざんねん';
  document.getElementById('fb-name').innerHTML = `${data.name}<span class="fb-kana">（${data.kana}）</span>`;
  document.getElementById('fb-sub').textContent = `県庁所在地：${data.capital} ／ ${data.region}地方`;

  document.getElementById('hint-btn').disabled = true;
}

function renderPairQuestion(){
  const key = queue[idx];
  const data = PAIR_DATA[key];
  const [codeA, codeB] = data.codes;

  const holder = document.getElementById('silhouette-holder');
  holder.innerHTML = `<svg class="silhouette-svg" viewBox="${data.viewBox}" xmlns="http://www.w3.org/2000/svg"><g fill-rule="evenodd">${data.markup}</g></svg>`;

  // build distractors: prefer neighbors-of-neighbors for a harder, plausible set
  const correctSet = new Set([codeA, codeB]);
  let neighborPool = new Set();
  [codeA, codeB].forEach(c=>{
    (NEIGHBORS[c] || new Set()).forEach(n=>{ if(!correctSet.has(n)) neighborPool.add(n); });
  });
  let distractorPool = [...neighborPool];
  if(distractorPool.length < 4){
    const rest = CODES.filter(c=>!correctSet.has(c) && !neighborPool.has(c));
    distractorPool = distractorPool.concat(sample(rest, 4 - distractorPool.length));
  }
  const distractors = sample(distractorPool, 4);
  const options = shuffle([codeA, codeB, ...distractors]);

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const pickHint = document.getElementById('pick-hint');
  pickHint.style.display = '';
  pickHint.innerHTML = `2つの都道府県を選んでね（<strong id="pick-count">0</strong> / 2）`;

  options.forEach(optCode=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = PREF_DATA[optCode].name;
    btn.dataset.code = optCode;
    btn.addEventListener('click', ()=>togglePairPick(optCode, btn, codeA, codeB));
    choicesEl.appendChild(btn);
  });

  highlightPassportCurrent(null);
}

function togglePairPick(code, btnEl, codeA, codeB){
  if(answeredThisQ) return;
  const already = pickedCodes.includes(code);
  if(already){
    pickedCodes = pickedCodes.filter(c=>c!==code);
    btnEl.classList.remove('picked');
  } else {
    if(pickedCodes.length >= 2) return;
    pickedCodes.push(code);
    btnEl.classList.add('picked');
  }
  const countEl = document.getElementById('pick-count');
  if(countEl) countEl.textContent = pickedCodes.length;

  if(pickedCodes.length === 2){
    setTimeout(()=>evaluatePairAnswer(codeA, codeB), 250);
  }
}

function evaluatePairAnswer(codeA, codeB){
  if(answeredThisQ) return;
  answeredThisQ = true;
  const correctSet = new Set([codeA, codeB]);
  const pickedSet = new Set(pickedCodes);
  const isCorrect = pickedSet.size===2 && correctSet.has(pickedCodes[0]) && correctSet.has(pickedCodes[1]);

  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = true;
    const c = b.dataset.code;
    const wasPicked = pickedSet.has(c);
    if(correctSet.has(c)){
      b.classList.add(wasPicked ? 'correct' : 'reveal');
    } else if(wasPicked){
      b.classList.add('wrong');
    }
  });

  if(isCorrect){
    score++;
    document.getElementById('stamp-burst').classList.add('show');
  }
  const key = `${codeA}-${codeB}`;
  results.push({type:'pair', key, correct: isCorrect});
  document.getElementById('score-label').textContent = `せいかい ${score}`;

  const da = PREF_DATA[codeA], db = PREF_DATA[codeB];
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'is-correct' : 'is-wrong');
  document.getElementById('fb-result').textContent = isCorrect ? 'せいかい！' : 'ざんねん';
  document.getElementById('fb-name').innerHTML = `${da.name}<span class="fb-kana">（${da.kana}）</span> ＋ ${db.name}<span class="fb-kana">（${db.kana}）</span>`;
  document.getElementById('fb-sub').textContent = `${da.name}：${da.capital}／${db.name}：${db.capital}`;

  document.getElementById('hint-btn').disabled = true;
}

document.getElementById('next-btn').addEventListener('click', ()=>{
  idx++;
  if(idx >= queue.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
});

document.getElementById('hint-btn').addEventListener('click', ()=>{
  if(settings.mode === 'pair'){
    const [codeA, codeB] = PAIR_DATA[queue[idx]].codes;
    showHintMap([codeA, codeB]);
  } else {
    showHintMap([queue[idx]]);
  }
});

function showHintMap(codes){
  const source = document.getElementById('hint-map-source');
  const clone = source.cloneNode(true);
  clone.removeAttribute('id');
  clone.querySelectorAll('.prefecture').forEach(g=>{
    if(codes.includes(g.getAttribute('data-code'))){
      g.style.fill = '#bd2a2e';
      g.style.stroke = '#8f1f22';
    } else {
      g.style.fill = '#e2d8bf';
      g.style.stroke = '#b9ad8c';
    }
  });
  const panel = document.getElementById('hint-panel');
  panel.innerHTML = '';
  panel.appendChild(clone);
  const p = document.createElement('p');
  const regions = [...new Set(codes.map(c=>PREF_DATA[c].region))].join('・');
  const label = codes.length>1 ? '赤い場所が答えの2つの都道府県だよ。' : '赤い場所が答えの都道府県だよ。';
  p.innerHTML = `${label}<br><strong>${regions}地方</strong>にあるよ。`;
  panel.appendChild(p);
  panel.classList.add('show');
}

// ---------- passport ----------
function buildPassport(){
  const body = document.getElementById('passport-body');
  body.innerHTML = '';
  const activeCodes = new Set(queue);
  const byRegion = {};
  REGION_ORDER.forEach(r=>byRegion[r]=[]);
  currentPool().forEach(c=>byRegion[PREF_DATA[c].region].push(c));

  REGION_ORDER.forEach(region=>{
    const codesInRegion = byRegion[region];
    if(codesInRegion.length===0) return;
    const group = document.createElement('div');
    group.className = 'region-group';
    const label = document.createElement('div');
    label.className = 'region-group-label';
    label.textContent = region;
    group.appendChild(label);
    const grid = document.createElement('div');
    grid.className = 'stamp-grid';
    codesInRegion.forEach(c=>{
      const cell = document.createElement('div');
      cell.className = 'stamp-cell';
      cell.dataset.code = c;
      cell.title = PREF_DATA[c].name;
      cell.textContent = PREF_DATA[c].name[0];
      if(!activeCodes.has(c)) cell.style.opacity = '.25';
      grid.appendChild(cell);
    });
    group.appendChild(grid);
    body.appendChild(group);
  });
}
function highlightPassportCurrent(code){
  document.querySelectorAll('.stamp-cell').forEach(cell=>{
    cell.classList.toggle('current', cell.dataset.code === code);
  });
}
function markPassport(code, isCorrect){
  const cell = document.querySelector(`.stamp-cell[data-code="${code}"]`);
  if(!cell) return;
  cell.classList.remove('current');
  cell.classList.add(isCorrect ? 'done-correct' : 'done-wrong');
}

// ---------- result ----------
function finishQuiz(){
  document.getElementById('result-score').textContent = score;
  document.getElementById('result-total').textContent = queue.length;
  const rate = score / queue.length;
  let msg = '';
  if(rate === 1) msg = 'パーフェクト！全部のスタンプが集まったよ。';
  else if(rate >= 0.8) msg = 'すごい！ほとんど正解できたね。';
  else if(rate >= 0.5) msg = 'よくできました。もう一度でさらに上を目指そう。';
  else msg = '間違えた都道府県をチェックして、もう一度チャレンジしよう。';
  document.getElementById('result-msg').textContent = msg;

  const wrap = document.getElementById('review-wrap');
  const missed = results.filter(r=>!r.correct);
  if(missed.length===0){
    wrap.innerHTML = '<p class="review-empty">まちがいはありませんでした。</p>';
  } else {
    const ul = document.createElement('ul');
    ul.className = 'review-list';
    missed.forEach(m=>{
      const li = document.createElement('li');
      if(m.type === 'pair'){
        const [a,b] = m.key.split('-');
        const da = PREF_DATA[a], db = PREF_DATA[b];
        li.innerHTML = `<span><span class="rl-name">${da.name}＋${db.name}</span><span class="rl-kana">${da.kana}・${db.kana}</span></span><span>${da.region}地方</span>`;
      } else {
        const d = PREF_DATA[m.code];
        li.innerHTML = `<span><span class="rl-name">${d.name}</span><span class="rl-kana">${d.kana}</span></span><span>${d.capital}</span>`;
      }
      ul.appendChild(li);
    });
    wrap.innerHTML = `<p class="field-label" style="margin-top:0;">${settings.mode==='pair' ? 'まちがえた組み合わせ' : 'まちがえた都道府県'}</p>`;
    wrap.appendChild(ul);
  }

  showScreen('screen-result');
}

document.getElementById('retry-btn').addEventListener('click', ()=>{
  beginQuiz();
});
document.getElementById('restart-btn').addEventListener('click', ()=>{
  showScreen('screen-start');
});
</script>
